<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: "AlbertSans";
    src: url("../public/fonts/AlbertSans-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "AlbertSans";
    src: url("../public/fonts/AlbertSans-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }
  @font-face {
    font-family: "AlbertSans";
    src: url("../public/fonts/AlbertSans-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "AlbertSans", system-ui, -apple-system, sans-serif;
    background: #ffffff;
    color: #242424;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: -220px;
    left: 50%;
    width: 1050px;
    height: 680px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(41,101,228,0.16) 0%, rgba(41,101,228,0.05) 55%, rgba(41,101,228,0) 75%);
    filter: blur(10px);
    pointer-events: none;
  }
  .brand {
    position: absolute;
    top: 50px;
    left: 50px;
    z-index: 3;
  }
  .brand img {
    height: 36px;
    width: auto;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
    text-align: center;
  }
  h1 {
    font-size: 40px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  p.sub {
    margin-top: 10px;
    font-size: 18px;
    line-height: 1.6;
    color: #646464;
    max-width: 520px;
  }
  .phones {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 380px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 56px;
    z-index: 2;
  }
  .phone {
    padding: 8px;
    border-radius: 36px;
    background: linear-gradient(145deg,#4a4a4a 0%,#333 15%,#252525 50%,#333 85%,#4a4a4a 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), inset 0 1px rgba(255,255,255,0.25), 0 24px 50px -12px rgba(0,0,0,0.32), 0 0 0 1px rgba(0,0,0,0.4);
    width: 240px;
    height: 640px;
  }
  .phone .screen {
    width: 100%;
    height: 100%;
    border-radius: 29px;
    overflow: hidden;
    background: #000;
  }
  .phone .screen img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="brand">
      <img src="../public/icons/logo.png" alt="Qawwam" />
    </div>
    <div class="content">
      <h1>Connect your account</h1>
      <p class="sub">Link accounts and unlock personalised insights — securely synced and always private.</p>
    </div>

    <div class="phones">
      <div class="phone">
        <div class="screen">
          <img src="../public/screenshot/light/account_link.png" alt="" />
        </div>
      </div>
      <div class="phone">
        <div class="screen">
          <img src="../public/screenshot/light/account_link_analytic.png" alt="" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
